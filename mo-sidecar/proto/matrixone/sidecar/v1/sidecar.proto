syntax = "proto3";

package matrixone.sidecar.v1;

// FlightDescriptor.cmd for GetFlightInfo/BeginExecution.
message ExecuteSubstraitRequest {
  uint32 protocol_version = 1;
  string substrait_version = 2;
  bytes capability_hash = 3;
  uint64 max_batch_bytes = 4;
  uint64 deadline_unix_ms = 5;
  bytes plan = 6;
  bytes query_id = 7;
  bytes idempotency_key = 8;
  optional uint64 account_id = 9;
  uint64 max_input_batch_bytes = 10;
  bytes result_schema = 11; // NativeResultSchema wire value echoed in FlightInfo.schema.
}

// Exact MatrixOne physical result schema. DoGet sends application-metadata-only
// FlightData messages whose app_metadata is an MOB1-framed batch.MarshalBinary
// payload. Flight emits one empty Arrow transport schema; every later
// FlightData.data_header is the MOB1 frame itself.
message NativeResultSchema {
  uint32 version = 1;
  repeated NativeResultColumn columns = 2;
}

message NativeResultColumn {
  string name = 1;
  uint32 oid = 2;
  int32 width = 3;
  int32 scale = 4;
  uint32 charset = 5;
  bool not_nullable = 6;
}

// FlightDescriptor.cmd on a DoPut stream. The ticket identifies one prepared
// execution and stream_ref selects one StreamRead leaf in its retained plan.
message UploadInputRequest {
  bytes ticket = 1;
  bytes stream_ref = 2;
}

// Cumulative acknowledgement returned in PutResult.app_metadata.
message UploadInputAck {
  uint64 acknowledged_batches = 1;
  uint64 rows = 2;
  uint64 bytes = 3;
  bool complete = 4;
  bool not_needed = 5;
  bool ready = 6;
}

// Flight Action.body for CancelExecution. Exactly one identity is required.
message CancelExecutionRequest {
  bytes ticket = 1;
  bytes idempotency_key = 2;
}

// Authenticated HTTPS request sent to MatrixOne. tae_read is the canonical
// matrixone.sirius.v1.TaeRead wire value from the retained Substrait plan.
message ResolveTaeReadRequest {
  bytes tae_read = 1;
  bytes requested_schema = 2;
}

// MatrixOne must echo the signed read and return the lease-bound manifest and
// canonical Substrait schema. The sidecar verifies all three before scanning.
message ResolveTaeReadResponse {
  bytes tae_read = 1;
  bytes manifest = 2;
  bytes canonical_schema = 3;
}
