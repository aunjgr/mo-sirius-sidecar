service-type = "CN"
data-dir = "./mo-data"

[log]
level = "info"

[cn]
uuid = "dd1dccb4-4d3c-41f8-b482-5251dc7a41bf"
port-base = 18000

# This profile is intentionally local-CN and benchmark-only. It uses the
# non-durable lease manager only while the paired TN has GC disabled.
[cn.sirius]
enabled = true
benchmark-no-gc = true
flight-address = "127.0.0.1:32010"
flight-server-name = "sidecar"
flight-client-cert-path = "/etc/sirius-certs/mo-flight-client.crt"
flight-client-key-path = "/etc/sirius-certs/mo-flight-client.key"
flight-server-ca-path = "/etc/sirius-certs/sidecar-flight-ca.crt"
resolver-address = "127.0.0.1:32011"
resolver-server-cert-path = "/etc/sirius-certs/mo-resolver-server.crt"
resolver-server-key-path = "/etc/sirius-certs/mo-resolver-server.key"
resolver-client-ca-path = "/etc/sirius-certs/sidecar-read-client-ca.crt"
resolver-client-cert-path = "/etc/sirius-certs/sidecar-read-client.crt"
data-dir = "/mo-data/shared"
request-timeout = "10m"
cleanup-timeout = "30s"
lease-ttl = "15m"

[cn.Engine]
prefetch-on-subscribed = [
    '^mo_catalog\.mo_tables$',
    '^mysql\..*$',
    '^test1\..*$',
    '^test2\.t1$',
]

[malloc]
check-fraction = 65536
enable-metrics = true
mpool-profiling = true

[observability]
disableMetric = false
enable-metric-to-prom = true
status-port = 7001
